<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 - Chat Simulate</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="layout">
    
    <div class="main-content">
      <div class="header">
        <h1>🔍 搜索</h1>
      </div>
      <div class="page-container">
        <div class="card">
          <div class="flex gap-8">
            <input id="search-box" class="input" placeholder="输入关键词，支持 FTS5 语法（如 '你 AND 好'）" style="flex:1;">
            <select id="search-type" class="select" style="width:auto;">
              <option value="history">对话历史</option>
              <option value="weights">Token 权重</option>
              <option value="corpus">训练语料库</option>
            </select>
            <button class="btn btn-primary" onclick="doSearch()">🔍 搜索</button>
          </div>
        </div>
        <div class="card" style="margin-top:16px;">
          <div class="card-title flex-between">
            <span>搜索结果</span>
            <span id="result-count" class="text-muted"></span>
          </div>
          <div id="results"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>

    async function doSearch() {
      const q = document.getElementById('search-box').value.trim();
      const type = document.getElementById('search-type').value;
      if (!q) return toast('请输入关键词', 'error');
      try {
        let data;
        if (type === 'history') data = await API.searchHistory(q);
        else if (type === 'weights') data = await API.searchWeights(q);
        else data = await API.searchCorpus(q);

        document.getElementById('result-count').textContent = `${data.results.length} 条结果`;
        const container = document.getElementById('results');

        if (!data.results.length) {
          container.innerHTML = '<div class="text-muted" style="padding:30px;text-align:center;">没有找到结果</div>';
          return;
        }

        let html = '';
        if (type === 'history') {
          html = data.results.map(r => `
            <div style="padding:12px;border-bottom:1px solid var(--border);">
              <div class="flex-between"><span class="tag ${r.role === 'user' ? 'info' : 'success'}">${r.role}</span>
              <span class="text-muted" style="font-size:11px;">${r.session_name || '-'} · ${formatTime(r.created_at)}</span></div>
              <div style="margin-top:6px;">${escapeHtml(r.content)}</div>
            </div>
          `).join('');
        } else if (type === 'weights') {
          html = data.results.map(r => `
            <div style="padding:12px;border-bottom:1px solid var(--border);">
              <div class="flex-between">
                <span style="font-weight:600;">${escapeHtml(r.token)}</span>
                <span class="text-muted" style="font-size:11px;">${r.layer} · count=${r.count} · w=${r.weight.toFixed(2)}</span>
              </div>
              <div class="font-mono text-muted" style="margin-top:4px;font-size:12px;">ctx: ${escapeHtml(r.context)}</div>
            </div>
          `).join('');
        } else {
          html = data.results.map(r => `
            <div style="padding:12px;border-bottom:1px solid var(--border);">
              <div class="tag">${r.source}</div>
              <div style="margin-top:4px;"><span class="text-muted">Q:</span> ${escapeHtml(r.input)}</div>
              <div style="margin-top:2px;"><span class="text-muted">A:</span> ${escapeHtml(r.output)}</div>
            </div>
          `).join('');
        }
        container.innerHTML = html;
      } catch (e) { toast(e.message, 'error'); }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    document.getElementById('search-box').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doSearch();
    });
  </script>
</body>
</html>
